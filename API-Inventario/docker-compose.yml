services:
  # SQL Server local
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventariodb-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./inventariodb.sql:/scripts/inventariodb.sql:ro
    healthcheck:
      test: >
        /bin/bash -c "
        (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' 2>/dev/null) ||
        (/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' 2>/dev/null) ||
        exit 1
        "
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - inventario-net

  # Inicializa la base de datos (solo la primera vez)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventariodb-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    volumes:
      - ./inventariodb.sql:/scripts/inventariodb.sql:ro
    entrypoint: >
      /bin/bash -c "
        echo 'Aplicando inventariodb.sql...' &&
        ( /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P 'YourStrong!Passw0rd' -C -i /scripts/inventariodb.sql ||
          /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'YourStrong!Passw0rd' -C -i /scripts/inventariodb.sql ) &&
        echo 'Base de datos inventariodb lista.'
      "
    networks:
      - inventario-net
    restart: "no"

  # API Go
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario-api
    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_DRIVER: sqlserver
      DB_SOURCE: "sqlserver://sa:YourStrong!Passw0rd@mssql:1433?database=inventariodb&encrypt=true&TrustServerCertificate=true"
      SERVER_URL: "0.0.0.0:8080"
      PORT: "8080"
      API_VERSION: "api/v1"
      SECRET: "laprograesgeniallaprograesgenial"
      BACKUP_DIR: ""
      GIN_MODE: debug
    ports:
      - "8080:8080"
    networks:
      - inventario-net
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  inventario-net:
    driver: bridge